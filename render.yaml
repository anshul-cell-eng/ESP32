services:
  # ==============================================================================
  # 1. SENTINEL Backend Web Service (FastAPI + Uvicorn)
  # ==============================================================================
  - type: web
    name: sentinel-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: SENTINEL_DEVICE_TOKEN
        value: sentinel_dev_secret_token_2026
      - key: MODE
        value: LIVE
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sentinel-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ==============================================================================
  # 2. SENTINEL Frontend Static Site (React + Vite + Tailwind)
  # ==============================================================================
  - type: web
    name: sentinel-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sentinel-backend
          envVarKey: RENDER_EXTERNAL_URL

# ==============================================================================
# 3. SENTINEL Managed Persistent PostgreSQL Database
# ==============================================================================
databases:
  - name: sentinel-db
    databaseName: sentinel
    user: sentinel
    plan: free
    region: oregon
